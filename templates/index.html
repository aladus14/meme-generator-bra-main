<!doctype html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0"
  >
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <link rel="stylesheet" href="../static/css/style.css">
  <title>Gerador de memes</title>
</head>
<body>
  <header class="header">
    <img src="../static/img/logo.svg" alt="logo" width="50" height="50">
    <ul class="main-list">
        <li class="list__item">
          <a href="">Página inicial</a>
        </li>
        <li class="list__item">
          <a href="">Coleção</a>
        </li>
        <li class="list__item">
          <a href="">Feedback</a>
        </li>
    </ul>
  </header>
  <main>
    {% block content %}
    <div class="form-block">
      <h1>Gere seu meme!</h1>
      <form method="POST" action="{{ url_for('index') }}">
        <ul class="form-list">
          <li class="form-list_item">
            <label for="image-selector">Selecione um meme</label>
            <select name="image-selector" id="image-selector">
              <option value="logo.svg" {% if selected_image == 'logo.svg' %}selected{% endif %}>Selecione um meme</option>
              <option value="meme_1.jpg" {% if selected_image == 'meme_1.jpg' %}selected{% endif %}>Garota Desastre</option>
              <option value="meme_2.jpg" {% if selected_image == 'meme_2.jpg' %}selected{% endif %}>Dois botões</option>
              <!-- TAREFA #1 ADICIONE NOVAS OPÇÕES DE MEMES-->




              <option value="gojo banguela.jpeg" {% if selected_image == 'gojo banguela.jpeg' %}selected{% endif %}>Gojo Banguela</option>
              <option value="coruja.jpeg" {% if selected_image == 'coruja.jpeg' %}selected{% endif %}>Coruja</option>
              <option value="will smith.jpeg" {% if selected_image == 'will smith.jpeg' %}selected{% endif %}>Will Smith</option>




              <!------------------------------------------------->
            </select>
          </li>
          <li class="form-list_item">
            <label for="textTop">Digite o texto superior aqui</label>
            <input class="input_text" type="text" placeholder="Texto superior" name="textTop">
          </li>
          <li class="form-list_item">
            <label for="textBottom">Digite o texto inferior aqui</label>
            <input class="input_text" type="text" placeholder="Texto inferior" name="textBottom">
          </li>
          <li class="form-list_item">
            <label for="color-selector">Defina a cor do texto</label>
            <select name="color-selector" id="color-selector">
              <option value="white" {% if selected_color == 'white' %}selected{% endif %}>Branco</option>
              <option value="black" {% if selected_color == 'black' %}selected{% endif %}>Preto</option>
              <!-- TAREFA ADICIONAR ADICIONE MAIS OPÇÕES DE CORES PARA O TEXTO DO MEME -->

              
              <option value="red" {% if selected_color == 'red' %}selected{% endif %}>Vermelho</option>
              <option value="blue" {% if selected_color == 'blue' %}selected{% endif %}>Azul</option>
              <option value="green" {% if selected_color == 'green' %}selected{% endif %}>Verde</option>






            <!------------------------------------------------->
            </select>
          </li>
          <li class="form-list_item">
            <label for="textTop_y">Distância do topo da imagem até o texto (em porcentagem)</label>
              <input
                class="input_text"
                id="textTop_y"
                type="Number"
                name="textTop_y"
                placeholder="Ex.: 20"
              >
            <small>Quanto menor o valor, mais próximo do topo da imagem.</small>
          </li>

          <li class="form-list_item">
          <label for="textBottom_y">Distância da parte de baixo da imagem até o texto (em porcentagem)</label>
            <input
            class="input_text"
            id="textBottom_y"
            type="Number"
            name="textBottom_y"
            placeholder="Ex.: 20"
            >
          <small>Quanto menor o valor, mais próximo da parte de baixo da imagem.</small>
          </li>
          <button type="submit">Gerar meme</button>
        </ul>
      </form>
    </div>
    <div class="meme-block" id="memeBlock">

    <!-- Tarefa #3. Insira as variáveis corretas nas {{chaves}} que estão vazias  style="color: {{preencha}};top: {{preencha}}%;" -->
     <p class="text_top" style="color: {{selected_color}};top: {{textTop_y}}%;">

      {{ textTop }}
     
      </p>

      <img class="meme" src="{{ url_for('serve_images', path=selected_image) }}" alt="{{ selected_image }}">

    <!-- Tarefa #3. Insira as variáveis corretas nas {{chaves}} que estão vazias  style="color: {{preencha}};bottom: {{preencha}}%;" -->
      <p class="text_bottom" style="color: {{selected_color}};bottom: {{textBottom_y}}%;">

      {{ textBottom }}

      </p>
      
    </div>
    {% endblock %}
  </main>
  <footer>

  </footer>
</body>
</html>
